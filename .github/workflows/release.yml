# 三平台发布流水线（M3 提前落地）。
#
# 触发方式：
# - 推送 v* 标签：构建三平台二进制并创建 GitHub Release；
# - 手动触发（workflow_dispatch）：只构建并上传 artifact（不打 Release）。
#
# 产物：每个目标平台一个压缩包，内含 mak 与 myapikey 两个等价二进制；
# 另有 Windows GUI 的 NSIS 安装包（Tauri 2，见 build-windows-gui job）。
# macOS 提供 aarch64（Apple Silicon）与 x86_64 两个包。
#
# 已知限制（如实记录）：未购买 Apple 开发者账号，产物未签名/公证，
# 浏览器下载的文件带隔离属性，首次运行需 `xattr -d com.apple.quarantine <文件>`；
# 用 curl 下载则无此问题（README 指引用 curl）。

name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz
          - os: macos-latest
            target: x86_64-apple-darwin
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
    steps:
      - uses: actions/checkout@v4

      # Linux 的 keyring 后端（Secret Service）编译期依赖 dbus
      - name: Install Linux build deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build (release)
        run: cargo build --release -p myapikey-cli --target ${{ matrix.target }}

      - name: Package (unix)
        if: runner.os != 'Windows'
        run: |
          name="myapikey-${GITHUB_REF_NAME:-manual}-${{ matrix.target }}"
          mkdir -p "pkg/$name"
          cp "target/${{ matrix.target }}/release/mak" "pkg/$name/"
          cp "target/${{ matrix.target }}/release/myapikey" "pkg/$name/"
          tar -czf "pkg/$name.tar.gz" -C pkg "$name"

      - name: Package (windows)
        if: runner.os == 'Windows'
        run: |
          $name = "myapikey-$env:GITHUB_REF_NAME-${{ matrix.target }}"
          New-Item -ItemType Directory -Force -Path "pkg/$name" | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/mak.exe" "pkg/$name/"
          Copy-Item "target/${{ matrix.target }}/release/myapikey.exe" "pkg/$name/"
          Compress-Archive -Path "pkg/$name" -DestinationPath "pkg/$name.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: myapikey-${{ matrix.target }}
          path: pkg/*.tar.gz
          if-no-files-found: ignore
      - name: Upload artifact (zip)
        uses: actions/upload-artifact@v4
        with:
          name: myapikey-${{ matrix.target }}-zip
          path: pkg/*.zip
          if-no-files-found: ignore

  # Windows GUI 安装包（NSIS）。CLI 与 GUI 分开出 job：
  # GUI 需要 Node 工具链与 ui/ 的 npm 依赖，构建时间显著更长，独立成 job
  # 便于并行、且不影响三平台 CLI 矩阵的缓存与日志可读性。
  build-windows-gui:
    name: build windows-gui (nsis)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: crates/myapikey-gui/ui/package-lock.json

      - name: Install UI deps
        working-directory: crates/myapikey-gui/ui
        run: npm ci

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
          key: windows-gui

      # 与本地 dev 一致的调用方式：从 crate 根调用 ui 内的 tauri CLI，
      # beforeBuildCommand（npm run build）由 CLI 以 ui/ 为工作目录执行。
      # workspace 根在仓库根目录，NSIS 产物落在 <repo>/target/release/bundle/nsis/。
      - name: Build GUI installer
        working-directory: crates/myapikey-gui
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: ui/node_modules/.bin/tauri build

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: myapikey-windows-gui-installer
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/nsis/*.sig
          if-no-files-found: error

  # 仅打标签时创建 Release 并挂上全部产物
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, build-windows-gui]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: false

      # 应用内更新（D16）的版本清单：从签名产物生成 latest.json。
      # notes 固定短句，破坏性判定依赖主版本号提升自动触发；
      # 次版本的破坏性升级（如 vault 格式变更）按红线本就需主人手动
      # 把关发布——届时手动改写 Release 里的 latest.json 首行加
      # [breaking] 标记即可
      - name: Generate updater latest.json
        run: |
          python3 - <<'PYEOF'
          import json, glob, os, datetime
          tag = os.environ['GITHUB_REF_NAME']
          version = tag.lstrip('v')
          sig = glob.glob(f'dist/**/MyApiKey_{version}_*.sig', recursive=True)[0]
          exe = sig[:-len('.sig')]
          name = os.path.basename(exe)
          doc = {
              'version': version,
              'notes': 'See the release page for details.',
              'pub_date': datetime.datetime.now(datetime.timezone.utc)
                  .isoformat(timespec='seconds').replace('+00:00', 'Z'),
              'platforms': {
                  'windows-x86_64': {
                      'signature': open(sig).read().strip(),
                      'url': f'https://github.com/Haaaatcher/MyApiKey/releases/download/{tag}/{name}',
                  }
              },
          }
          with open('latest.json', 'w') as f:
              json.dump(doc, f, ensure_ascii=False, indent=2)
          print('latest.json written for', version)
          PYEOF

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/**/*.tar.gz
            dist/**/*.zip
            dist/**/*.exe
            dist/**/*.sig
            latest.json
