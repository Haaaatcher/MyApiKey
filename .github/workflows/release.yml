# 三平台发布流水线（M3 提前落地）。
#
# 触发方式：
# - 推送 v* 标签：构建三平台二进制并创建 GitHub Release；
# - 手动触发（workflow_dispatch）：只构建并上传 artifact（不打 Release）。
#
# 产物：每个目标平台一个压缩包（平铺单 bin makara，D40）；
# 另有 Windows GUI 的 NSIS 安装包（build-windows-gui job）与
# macOS GUI 的 dmg 安装包（build-macos-gui job，D54）。
# macOS 提供 aarch64（Apple Silicon）与 x86_64 两个包。
#
# 已知限制（如实记录）：未购买 Apple 开发者账号，产物未签名/公证，
# 浏览器下载的文件带隔离属性，首次运行需 `xattr -d com.apple.quarantine <文件>`；
# 用 curl 下载则无此问题（README 指引用 curl）。

name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # ubuntu-latest 已迁移 26(resolute)：apt 对 ubuntu 镜像域名持续 DNS 失败（两次发版实测），固定到 24.04 稳定镜像
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz
          - os: macos-latest
            target: x86_64-apple-darwin
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
    steps:
      - uses: actions/checkout@v4

      # Linux 的 keyring 后端（Secret Service）：dbus-secret-service v4
      # 为纯 Rust 实现，编译不需要 libdbus-1-dev——曾因 runner 对
      # *.ubuntu.com 域名 DNS 故障导致 apt 装依赖必败、Linux job 必崩
      # （2026-11-11 发版三连失败实证），依赖核实后整步删除

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Inject GitHub App client secret (embedded)
        shell: bash
        env:
          MYAPIKEY_CLIENT_SECRET: ${{ secrets.MYAPIKEY_CLIENT_SECRET }}
        run: printf '%s' "$MYAPIKEY_CLIENT_SECRET" > client-secret.txt

      - name: Build (release)
        run: cargo build --release -p myapikey-cli --target ${{ matrix.target }}

      - name: Package (unix)
        if: runner.os != 'Windows'
        run: |
          name="makara-${GITHUB_REF_NAME:-manual}-${{ matrix.target }}"
          mkdir -p "pkg/$name"
          cp "target/${{ matrix.target }}/release/makara" "pkg/$name/"
          # 平铺打包（包内根直接是二进制）：makara update 自更新按包根
          # 取二进制，不做目录层展开（D40）
          tar -czf "pkg/$name.tar.gz" -C "pkg/$name" makara
          # 完整性校验附件（D52）：makara update 下载后逐一比对
          sha256sum "pkg/$name.tar.gz" | sed "s|pkg/||" > "pkg/$name.tar.gz.sha256"

      - name: Package (windows)
        if: runner.os == 'Windows'
        run: |
          $name = "makara-$env:GITHUB_REF_NAME-${{ matrix.target }}"
          New-Item -ItemType Directory -Force -Path "pkg/$name" | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/makara.exe" "pkg/$name/"
          Compress-Archive -Path "pkg/$name/makara.exe" -DestinationPath "pkg/$name.zip"
          # 完整性校验附件（D52）
          $hash = (Get-FileHash -Algorithm SHA256 "pkg/$name.zip").Hash.ToLower()
          "$hash  $name.zip" | Out-File -Encoding ascii "pkg/$name.zip.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: makara-${{ matrix.target }}
          path: |
            pkg/*.tar.gz
            pkg/*.sha256
          if-no-files-found: ignore
      - name: Upload artifact (zip)
        uses: actions/upload-artifact@v4
        with:
          name: makara-${{ matrix.target }}-zip
          path: |
            pkg/*.zip
            pkg/*.sha256
          if-no-files-found: ignore

  # Windows GUI 安装包（NSIS）。CLI 与 GUI 分开出 job：
  # GUI 需要 Node 工具链与 ui/ 的 npm 依赖，构建时间显著更长，独立成 job
  # 便于并行、且不影响三平台 CLI 矩阵的缓存与日志可读性。
  build-windows-gui:
    name: build windows-gui (nsis)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: crates/myapikey-gui/ui/package-lock.json

      - name: Install UI deps
        working-directory: crates/myapikey-gui/ui
        run: npm ci

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
          key: windows-gui

      # 与本地 dev 一致的调用方式：从 crate 根调用 ui 内的 tauri CLI，
      # beforeBuildCommand（npm run build）由 CLI 以 ui/ 为工作目录执行。
      # workspace 根在仓库根目录，NSIS 产物落在 <repo>/target/release/bundle/nsis/。
      - name: Inject GitHub App client secret (embedded, GUI)
        shell: bash
        env:
          MYAPIKEY_CLIENT_SECRET: ${{ secrets.MYAPIKEY_CLIENT_SECRET }}
        run: |
          printf '%s' "$MYAPIKEY_CLIENT_SECRET" > client-secret.txt
          printf '%s' "$MYAPIKEY_CLIENT_SECRET" > crates/myapikey-core/client-secret.txt

      - name: Build GUI installer
        working-directory: crates/myapikey-gui
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: ui/node_modules/.bin/tauri build

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: myapikey-windows-gui-installer
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/nsis/*.sig
          if-no-files-found: error

  # macOS GUI 安装包（dmg，仅 Apple Silicon，D26/D54）。人装 = dmg；
  # updater 机制件 .app.tar.gz + .sig 由 createUpdaterArtifacts 自动产出，
  # 是 latest.json darwin-aarch64 键的指向目标（dmg 本身不进更新清单）
  build-macos-gui:
    name: build macos-gui (dmg)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: crates/myapikey-gui/ui/package-lock.json

      - name: Install UI deps
        working-directory: crates/myapikey-gui/ui
        run: npm ci

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
          key: macos-gui

      # 与 Windows GUI job 同款注入：core 的 build.rs 从仓库根与 crate
      # 目录两处读 client-secret.txt（缺注入 = 用户自动续期失败）
      - name: Inject GitHub App client secret (embedded, GUI)
        shell: bash
        env:
          MYAPIKEY_CLIENT_SECRET: ${{ secrets.MYAPIKEY_CLIENT_SECRET }}
        run: |
          printf '%s' "$MYAPIKEY_CLIENT_SECRET" > client-secret.txt
          printf '%s' "$MYAPIKEY_CLIENT_SECRET" > crates/myapikey-core/client-secret.txt

      - name: Build GUI bundle
        working-directory: crates/myapikey-gui
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: ui/node_modules/.bin/tauri build

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: myapikey-macos-gui-bundle
          path: |
            target/release/bundle/dmg/*.dmg
            target/release/bundle/macos/*.app.tar.gz
            target/release/bundle/macos/*.app.tar.gz.sig
          if-no-files-found: error

  # 仅打标签时创建 Release 并挂上全部产物
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, build-windows-gui, build-macos-gui]
    runs-on: ubuntu-24.04
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: false

      # 应用内更新（D16）的版本清单：从签名产物生成 latest.json。
      # notes 固定短句，破坏性判定依赖主版本号提升自动触发；
      # 次版本的破坏性升级（如 vault 格式变更）按红线本就需主人手动
      # 把关发布——届时手动改写 Release 里的 latest.json 首行加
      # [breaking] 标记即可
      - name: Generate updater latest.json
        run: |
          python3 - <<'PYEOF'
          import json, glob, os, datetime, sys
          tag = os.environ['GITHUB_REF_NAME']
          version = tag.lstrip('v')
          # 品牌更名（2026-11-09）后产物名 Makara_<version>_*：glob 必须跟上。
          # 缺产物时明确报错退出而非裸 IndexError——错误信息直指对应的
          # 构建 job（2026-11-13 审查建议）。D54 起 latest.json 覆盖双平台键：
          # windows-x86_64（nsis 安装包）与 darwin-aarch64（.app.tar.gz 机制件，
          # 人装的 dmg 不进更新清单）
          platforms = {}
          win_sigs = glob.glob(f'dist/**/Makara_{version}_*.sig', recursive=True)
          if not win_sigs:
              sys.exit('发布中止：未找到 Windows 安装包签名件（期望 dist/**/Makara_<版本>_x64-setup.exe.sig）——检查 build-windows-gui job 是否成功且签名 secret 已注入')
          win_sig = win_sigs[0]
          win_exe = win_sig[:-len('.sig')]
          platforms['windows-x86_64'] = {
              'signature': open(win_sig).read().strip(),
              'url': f'https://github.com/' + os.environ.get('GITHUB_REPOSITORY', 'Haaaatcher/Makara') + '/releases/download/{tag}/{os.path.basename(win_exe)}',
          }
          mac_artifacts = glob.glob('dist/**/Makara*.app.tar.gz', recursive=True)
          if not mac_artifacts:
              sys.exit('发布中止：未找到 macOS updater 机制件（期望 dist/**/Makara*.app.tar.gz）——检查 build-macos-gui job 是否成功')
          mac_artifact = mac_artifacts[0]
          platforms['darwin-aarch64'] = {
              'signature': open(mac_artifact + '.sig').read().strip(),
              'url': f'https://github.com/' + os.environ.get('GITHUB_REPOSITORY', 'Haaaatcher/Makara') + '/releases/download/{tag}/{os.path.basename(mac_artifact)}',
          }
          doc = {
              'version': version,
              'notes': 'See the release page for details.',
              'pub_date': datetime.datetime.now(datetime.timezone.utc)
                  .isoformat(timespec='seconds').replace('+00:00', 'Z'),
              'platforms': platforms,
          }
          with open('latest.json', 'w') as f:
              json.dump(doc, f, ensure_ascii=False, indent=2)
          print('latest.json written for', version)
          PYEOF

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/**/*.tar.gz
            dist/**/*.zip
            dist/**/*.sha256
            dist/**/*.exe
            dist/**/*.dmg
            dist/**/*.app.tar.gz
            dist/**/*.sig
            latest.json
