# 三平台日常 CI（D54 Windows 保障条款的落地机制 + §10 承诺的三平台矩阵，
# 2026-11-12 用户拍板新增）。与 release.yml 分工：本工作流每次 push/PR
# 都跑 test + clippy + fmt，跨平台编译/行为问题在改动当时暴露，不等发版；
# Windows 真机冒烟仍走 release.yml 的 workflow_dispatch（发版前人工门）。
#
# 平台范围（有意为之）：Linux job 只跑 core + CLI——GUI 在 Linux 编译
# 需要 webkit2gtk 系统头文件（会重新引入 D53 刚拔掉的 apt 依赖），且
# 产品定位 Linux 仅 CLI（D12）；GUI 的编译与测试证据由 macOS 与
# Windows job 原生覆盖。

name: ci

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            packages: "-p myapikey-core -p myapikey-cli"
          - os: macos-latest
            target: aarch64-apple-darwin
            packages: "--workspace"
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            packages: "--workspace"
    steps:
      - uses: actions/checkout@v4

      # Linux 的 keyring 后端（Secret Service）：dbus-secret-service v4
      # 为纯 Rust 实现，无需 apt 装库（D52/D53 实证，与 release.yml 一致）
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
          key: ci-test-${{ matrix.target }}

      - name: Run tests
        run: cargo test ${{ matrix.packages }}

  clippy:
    name: clippy ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            packages: "-p myapikey-core -p myapikey-cli"
          - os: macos-latest
            target: aarch64-apple-darwin
            packages: "--workspace"
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            packages: "--workspace"
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
          key: ci-clippy-${{ matrix.target }}

      - name: Lint
        run: cargo clippy ${{ matrix.packages }} -- -D warnings

  fmt:
    name: fmt
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --check
