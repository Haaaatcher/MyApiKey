[package]
name = "myapikey-core"
description = "MyApiKey 核心逻辑库：数据模型、vault 加解密、git 同步、key 校验"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
chrono.workspace = true
argon2.workspace = true
aes-gcm.workspace = true
rand.workspace = true
zeroize.workspace = true
dirs.workspace = true
fd-lock.workspace = true
keyring.workspace = true
toml.workspace = true
reqwest.workspace = true

[features]
default = ["secret-service"]
# 启用 keyring 的 Linux secret-service 后端（经 D-Bus 访问 GNOME Keyring/KWallet）。
# 桌面发行版默认开启；无头服务器（无 libdbus-1-dev）安装时用
# `cargo install --no-default-features myapikey-cli` 关闭，
# 代价是 Linux 上不持久记住密码（每次手动输入），其余功能不受影响。
secret-service = ["keyring/sync-secret-service"]
